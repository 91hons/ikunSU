name: Build ikunSU

on:
  push:
    branches: [main, master, dev, ci]
    paths: ['manager/**', 'kernel/**', 'uapi/**', 'userspace/**', 'Cargo.*', 'version.properties', 'scripts/**', '.github/**']
  pull_request:
    paths: ['manager/**', 'kernel/**', 'uapi/**', 'userspace/**', 'Cargo.*', 'version.properties', 'scripts/**', '.github/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ikunSU-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  signing:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.identity.outputs.package }}
      expected_size: ${{ steps.identity.outputs.expected_size }}
      expected_hash: ${{ steps.identity.outputs.expected_hash }}
      temporary_keystore: ${{ steps.identity.outputs.temporary_keystore }}
      temporary: ${{ steps.identity.outputs.temporary }}
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare matching APK and kernel identity
        id: identity
        env:
          PROD_KEYSTORE: ${{ secrets.KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE=com.hons.ikunSU
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then PACKAGE=com.hons.ikunSU.pr; fi
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          if [ -n "$PROD_KEYSTORE" ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            test -n "$STORE_PASSWORD"
            test -n "$KEY_ALIAS"
            test -n "$KEY_PASSWORD"
            printf '%s' "$PROD_KEYSTORE" | base64 -d > signing.jks
            echo 'temporary=false' >> "$GITHUB_OUTPUT"
          else
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo 'Release tags require KEYSTORE, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets.' >&2
              exit 1
            fi
            STORE_PASSWORD=android
            KEY_ALIAS=ci
            keytool -genkeypair -keystore signing.jks -storetype JKS -alias ci \
              -keyalg RSA -keysize 2048 -validity 30 -storepass android -keypass android \
              -dname 'CN=ikunSU CI Test'
            echo 'temporary=true' >> "$GITHUB_OUTPUT"
            echo "temporary_keystore=$(base64 -w 0 signing.jks)" >> "$GITHUB_OUTPUT"
          fi
          keytool -exportcert -keystore signing.jks -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" -file certificate.der
          test "$(stat -c%s certificate.der)" -le 1024 || { echo 'Certificate exceeds the kernel verifier limit (1024 bytes).' >&2; exit 1; }
          echo "expected_size=$(printf '0x%x' "$(stat -c%s certificate.der)")" >> "$GITHUB_OUTPUT"
          echo "expected_hash=$(sha256sum certificate.der | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  build-lkm:
    needs: signing
    uses: ./.github/workflows/build-lkm.yml
    with:
      package_name: ${{ needs.signing.outputs.package }}
      expected_size: ${{ needs.signing.outputs.expected_size }}
      expected_hash: ${{ needs.signing.outputs.expected_hash }}

  build-ksuinit:
    uses: ./.github/workflows/ksuinit.yml

  build-ksud:
    needs: [signing, build-lkm, build-ksuinit]
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, x86_64-linux-android, riscv64-linux-android]
    uses: ./.github/workflows/ksud.yml
    with:
      target: ${{ matrix.target }}
      package_name: ${{ needs.signing.outputs.package }}
      expected_size: ${{ needs.signing.outputs.expected_size }}
      expected_hash: ${{ needs.signing.outputs.expected_hash }}
      pack_lkm: true
      pack_ksuinit: true

  build-manager:
    needs: [signing, build-ksud]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
      - uses: actions/download-artifact@v8
        with:
          pattern: ksud-*-linux-android
          path: artifacts
      - name: Place the freshly built ksud binaries before Gradle
        shell: bash
        run: |
          set -euo pipefail
          for entry in 'aarch64-linux-android arm64-v8a' 'x86_64-linux-android x86_64' 'riscv64-linux-android riscv64'; do
            read -r target abi <<< "$entry"
            test -s "artifacts/ksud-$target/ksud"
            mkdir -p "manager/app/src/main/jniLibs/$abi"
            cp "artifacts/ksud-$target/ksud" "manager/app/src/main/jniLibs/$abi/libksud.so"
          done
      - name: Prepare signing key
        env:
          TEMPORARY: ${{ needs.signing.outputs.temporary }}
          TEMP_KEYSTORE: ${{ needs.signing.outputs.temporary_keystore }}
          PROD_KEYSTORE: ${{ secrets.KEYSTORE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$TEMPORARY" = true ]; then
            printf '%s' "$TEMP_KEYSTORE" | base64 -d > manager/signing.jks
          else
            printf '%s' "$PROD_KEYSTORE" | base64 -d > manager/signing.jks
          fi
      - name: Build and check Manager
        working-directory: manager
        env:
          TEMPORARY: ${{ needs.signing.outputs.temporary }}
          PACKAGE: ${{ needs.signing.outputs.package }}
          ORG_GRADLE_PROJECT_KEYSTORE_FILE: ${{ github.workspace }}/manager/signing.jks
          ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$TEMPORARY" = true ]; then
            export ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD=android
            export ORG_GRADLE_PROJECT_KEY_ALIAS=ci
            export ORG_GRADLE_PROJECT_KEY_PASSWORD=android
          fi
          chmod +x gradlew
          ./gradlew clean assembleRelease lintRelease testDebugUnitTest \
            -PKSU_PACKAGE_NAME="$PACKAGE" -PKSU_REPOSITORY="$GITHUB_REPOSITORY" \
            -PIS_PR_BUILD="$([ "$GITHUB_EVENT_NAME" = pull_request ] && echo true || echo false)"
      - name: Record public build identity
        env:
          PACKAGE: ${{ needs.signing.outputs.package }}
          CERT_HASH: ${{ needs.signing.outputs.expected_hash }}
          CERT_SIZE: ${{ needs.signing.outputs.expected_size }}
          TEMPORARY: ${{ needs.signing.outputs.temporary }}
        run: |
          mkdir -p dist
          cp manager/app/build/outputs/apk/release/*.apk dist/
          source version.properties
          printf 'package=%s\ncertificate_sha256=%s\ncertificate_size=%s\ntemporary_test_key=%s\ncommit=%s\nversion_name=%s\nversion_code=%s\n' \
            "$PACKAGE" "$CERT_HASH" "$CERT_SIZE" "$TEMPORARY" "$GITHUB_SHA" \
            "$KSU_VERSION_NAME" "$KSU_VERSION_CODE" > dist/build-identity.txt
      - uses: actions/upload-artifact@v7
        with:
          name: manager
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: mappings
          path: manager/app/build/outputs/mapping/release/
